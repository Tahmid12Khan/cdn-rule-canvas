# demo-upstream nginx config. Listens on 8081 (matches the proxy
# UPSTREAM_BASE_URL=http://demo-upstream:8081) and serves the static demo
# articles. `/article` resolves to article.html so both /article and
# /article.html match the proxy feature_map glob `/article*`.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # Disable upstream compression so the proxy receives plain text/html to
    # modify (the proxy controls re-encoding itself).
    gzip off;

    location = /article {
        default_type text/html;
        try_files /article.html =404;
    }

    location = /free {
        default_type text/html;
        try_files /free.html =404;
    }

    # Default-serve the article page: real files win, anything else falls back
    # to article.html so every URL returns 200 (the proxy then applies rules).
    location / {
        default_type text/html;
        try_files $uri $uri.html $uri/ /article.html;
    }
}
