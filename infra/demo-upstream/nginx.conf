# demo-upstream config. Listens on 8081 (matches the proxy
# UPSTREAM_BASE_URL=http://demo-upstream:8081). Two jobs:
#   1. Serve the local static demo articles (article.html, free.html) and route
#      `/html` + `/html/*` to article.html so any `/html` URL exercises the demo.
#   2. Reverse-proxy everything else to https://www.dn.no, rewriting absolute
#      dn.no URLs in the body to site-relative paths and reducing every
#      Set-Cookie to just `name=value`.
#
# Image is openresty/openresty:alpine (stock nginx + ngx_http_lua_module). The
# Lua header filter is required because stock nginx cannot strip arbitrary
# cookie attributes (Domain/Path/Expires/Max-Age) — only flags.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # Disable own compression so the proxy (and sub_filter) receive plain
    # text/html to modify; the RRE proxy controls re-encoding itself.
    gzip off;

    # Strip every Set-Cookie attribute, keeping only `name=value`.
    header_filter_by_lua_block {
        local cookies = ngx.header["Set-Cookie"]
        if cookies then
            if type(cookies) ~= "table" then cookies = { cookies } end
            local out = {}
            for _, c in ipairs(cookies) do
                local nv = c:match("([^;]+)")
                if nv then
                    out[#out + 1] = nv:gsub("^%s*(.-)%s*$", "%1")
                end
            end
            ngx.header["Set-Cookie"] = out
        end
    }

    # `/html` and `/html/*` always resolve to the local demo article.
    location ~ ^/html(/.*)?$ {
        default_type text/html;
        try_files /article.html =404;
    }

    location = /article {
        default_type text/html;
        try_files /article.html =404;
    }

    location = /free {
        default_type text/html;
        try_files /free.html =404;
    }

    # Local static files win; anything else reverse-proxies to www.dn.no.
    location / {
        try_files $uri $uri.html @dnno;
    }

    location @dnno {
        proxy_pass https://www.dn.no;
        proxy_http_version 1.1;
        proxy_set_header Host www.dn.no;
        proxy_set_header Connection "";
        # Force a plain-text response so sub_filter can rewrite the body.
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        # Keep upstream redirects site-relative too.
        proxy_redirect https://www.dn.no/ /;
        proxy_redirect //www.dn.no/ /;

        # Rewrite absolute dn.no URLs in the HTML body to site-relative paths.
        # sub_filter_types defaults to text/html, which is all we rewrite.
        sub_filter_once off;
        sub_filter 'https://www.dn.no' '';
        sub_filter 'http://www.dn.no' '';
        sub_filter '//www.dn.no' '';
        sub_filter 'www.dn.no' '';
    }
}
