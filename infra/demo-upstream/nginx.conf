# demo-upstream config. Listens on 8081 (matches the proxy
# UPSTREAM_BASE_URL=http://demo-upstream:8081). Its only job is to serve the
# local static demo articles (article.html, free.html) plus the JSON fixture
# (article.json) so the RRE proxy has a real upstream to rewrite. `/html` +
# `/html/*` resolve to article.html so any `/html` URL exercises the demo; any
# unknown path 404s (no external reverse-proxy). Every Set-Cookie is reduced to
# just `name=value`.
#
# Image is openresty/openresty:alpine (stock nginx + ngx_http_lua_module). The
# Lua header filter is required because stock nginx cannot strip arbitrary
# cookie attributes (Domain/Path/Expires/Max-Age) — only flags.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # Disable own compression so the proxy (and sub_filter) receive plain
    # text/html to modify; the RRE proxy controls re-encoding itself.
    gzip off;

    # Strip every Set-Cookie attribute, keeping only `name=value`.
    header_filter_by_lua_block {
        local cookies = ngx.header["Set-Cookie"]
        if cookies then
            if type(cookies) ~= "table" then cookies = { cookies } end
            local out = {}
            for _, c in ipairs(cookies) do
                local nv = c:match("([^;]+)")
                if nv then
                    out[#out + 1] = nv:gsub("^%s*(.-)%s*$", "%1")
                end
            end
            ngx.header["Set-Cookie"] = out
        end
    }

    # `/html` and `/html/*` always resolve to the local demo article.
    location ~ ^/html(/.*)?$ {
        default_type text/html;
        try_files /article.html =404;
    }

    location = /article {
        default_type text/html;
        try_files /article.html =404;
    }

    location = /free {
        default_type text/html;
        try_files /free.html =404;
    }

    # JSON fixture for the demo-json-article rule (matches $.api == "demo-article").
    location = /article.json {
        default_type application/json;
        try_files /article.json =404;
    }

    # Serve local static files only; 404 for anything else.
    location / {
        try_files $uri $uri.html =404;
    }
}
