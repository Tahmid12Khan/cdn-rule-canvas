# RRE local stack. One-command boot from the repo root:
#   make up           (wraps `docker compose -f infra/docker-compose.yml up --build`)
# or directly:
#   docker compose -f infra/docker-compose.yml up --build
#
# Build context for backend/proxy is the repo root (`..`) because those crates
# depend on ../core/* via path. The frontend context is ../frontend.
#
# Service env values are kept consistent with backend/.env.example and
# proxy/.env.example. Secrets come ONLY from the root .env (see .env.example);
# never hard-code secrets here.

name: rre

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see infra/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-rre}
    ports:
      - "5432:5432"
    volumes:
      - rre-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rre} -d ${POSTGRES_DB:-rre}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Lightweight DB browser for local debugging.
  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rre}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rre}
      APP_ENV: ${APP_ENV:-dev}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      BIND_ADDR: 0.0.0.0:8000
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time. The browser reaches the
        # backend on the host port, so use the host-facing URL here.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  proxy:
    build:
      context: ..
      dockerfile: proxy/Dockerfile
    environment:
      PROXY_BIND_ADDR: 0.0.0.0:9000
      # demo-upstream serves on its internal port 8081 (matches proxy .env.example).
      UPSTREAM_BASE_URL: http://demo-upstream:8081
      BACKEND_BASE_URL: http://backend:8000
      APP_ENV: ${APP_ENV:-dev}
      ACTIVE_VERSION_TTL_SECS: ${ACTIVE_VERSION_TTL_SECS:-30}
      COMPILED_CACHE_CAPACITY: ${COMPILED_CACHE_CAPACITY:-256}
      UPSTREAM_CONNECT_TIMEOUT_SECS: ${UPSTREAM_CONNECT_TIMEOUT_SECS:-2}
      UPSTREAM_READ_TIMEOUT_SECS: ${UPSTREAM_READ_TIMEOUT_SECS:-10}
      # Config paths are relative to the image WORKDIR (/app).
      FEATURE_MAP_PATH: proxy/config/feature_map.yaml
      SANITIZER_CONFIG_PATH: proxy/config/sanitizer.yaml
    # Host port 9000 matches the feature_map host `localhost:9000`, so the
    # browser's Host header resolves the dn-article feature. Hit the demo at
    # http://localhost:9000/article.html
    ports:
      - "9000:9000"
    depends_on:
      backend:
        condition: service_healthy
      demo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Static HTML origin for the end-to-end demo. Serves infra/demo-upstream/*.html.
  # Internal port 8081 (proxy UPSTREAM_BASE_URL); host port 9001 for inspection.
  demo-upstream:
    image: nginx:1-alpine
    volumes:
      - ./demo-upstream:/usr/share/nginx/html:ro
      - ./demo-upstream/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9001:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/article.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  rre-pg-data:
    name: rre-pg-data
