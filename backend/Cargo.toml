# Standalone crate: empty [workspace] table detaches this from the zen root workspace.
[workspace]

[package]
name = "rre-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rre_backend"
path = "src/lib.rs"

[[bin]]
name = "rre-backend"
path = "src/main.rs"

# Domain-owned binaries (src/bin/seed_demo.rs, src/bin/export_schema.rs) are
# auto-discovered by Cargo once those leaf files exist.

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
config = { version = "0.15", default-features = false, features = ["json"] }
regex = "1"
once_cell = "1"
serde_with = "3"
# mustache rendering for saved-outcome resolve (flat interpolation over the
# saved outcome's own variables), matching the proxy's pinned version.
mustache = "0.9"
# Engine path dep (proxy is the primary consumer; included here per scaffold task spec).
zen-engine = { path = "../core/engine" }
# Shared rule crate. The edge-bundle exporter RETURNS `rre_core::edge::EdgeBundle`
# rather than a backend mirror, and reuses the applier's own reference detectors,
# so the exporter and the hosts that consume the bundle cannot disagree on either
# the wire shape or what counts as a component / saved-outcome reference.
rre-core = { path = "../rre-core" }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
