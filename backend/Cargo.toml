# Standalone crate: empty [workspace] table detaches this from the zen root workspace.
[workspace]

[package]
name = "rre-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rre_backend"
path = "src/lib.rs"

[[bin]]
name = "rre-backend"
path = "src/main.rs"

# Domain-owned binaries (src/bin/seed_demo.rs, src/bin/export_schema.rs) are
# auto-discovered by Cargo once those leaf files exist.

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
envy = "0.4"
regex = "1"
once_cell = "1"
# Engine path dep (proxy is the primary consumer; included here per scaffold task spec).
zen-engine = { path = "../core/engine" }

[dev-dependencies]
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["postgres"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
