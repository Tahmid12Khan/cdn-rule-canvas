[package]
name = "zen-playground"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
zen-engine = { path = "../core/engine" }
zen-expression = { path = "../core/expression" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
