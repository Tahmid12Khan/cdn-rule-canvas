# Feature map: (host, path glob) -> feature_id. ALL matching entries apply, in
# order, chaining the response body (the forwarder fans out via resolve_all).
# MVP: route EVERY localhost path to BOTH demo features. Each self-gates by the
# response content-kind, so on an HTML response only `dn-article` (the paywall
# feature) transforms and `dn-json-article` is a no-op; on a JSON response only
# `dn-json-article` (trim body + add paywall marker) transforms and `dn-article`
# is a no-op.
- host: "localhost:9000"
  path_glob: "/**"
  feature_id: "dn-article"
- host: "localhost:9000"
  path_glob: "/**"
  feature_id: "dn-json-article"
